<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>VINYL ARCHIVE</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    /* card + gap scale with the SHORTER viewport axis, so any ratio fits */
    --card: clamp(140px, 34vmin, 340px);
    --gap: calc(var(--card) * 0.30);
    --nav-h: 60px;
  }
  html,body{height:100%;background:#000;color:#f4f4f4;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit;text-decoration:none}

  /* ---------- background ---------- */
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(0,0,0,.78) 100%)}
  .grain{position:fixed;inset:-50%;z-index:2;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    animation:grainShift 1.1s steps(3) infinite}
  @keyframes grainShift{0%{transform:translate(0,0)}33%{transform:translate(-2%,1%)}66%{transform:translate(1%,-2%)}100%{transform:translate(0,0)}}
  .glow{position:fixed;left:50%;top:48%;width:80vmin;height:80vmin;z-index:1;pointer-events:none;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,255,255,.055),transparent 62%)}
  .dust{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
  .dust i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;
    animation:drift linear infinite}
  @keyframes drift{
    0%{transform:translate3d(0,105vh,0);opacity:0}
    12%{opacity:.55}88%{opacity:.55}
    100%{transform:translate3d(28px,-8vh,0);opacity:0}}

  /* ---------- nav ---------- */
  nav{position:fixed;top:0;left:0;right:0;z-index:70;height:var(--nav-h);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 clamp(14px,3.2vw,34px);
    background:linear-gradient(180deg,rgba(0,0,0,.72),transparent)}
  .logo{font-size:clamp(10px,1.5vmin,13px);font-weight:800;letter-spacing:.2em}
  .links{display:flex;gap:clamp(14px,2.4vw,30px);font-size:10px;letter-spacing:.24em;color:#8a8a8a}
  .links a{transition:color .25s}
  .links a:hover,.links a:focus-visible{color:#fff;outline:none}
  .acts{display:flex;gap:4px}
  .ico{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:#b4b4b4;
    font-size:15px;line-height:1;transition:background .25s,color .25s}
  .ico:hover,.ico:focus-visible{background:rgba(255,255,255,.07);color:#fff;outline:none}
  @media (max-width:640px){.links{display:none}}

  /* ---------- stage ---------- */
  .stage{position:fixed;inset:0;z-index:10;perspective:1400px;perspective-origin:50% 50%;
    touch-action:none}
  .rail{position:absolute;left:50%;top:calc(50% + var(--nav-h) / 2);width:0;height:0;transform-style:preserve-3d}

  /* ---------- album ---------- */
  .album{position:absolute;left:0;top:0;width:var(--card);height:var(--card);
    margin-left:calc(var(--card) / -2);margin-top:calc(var(--card) / -2);
    transform-style:preserve-3d;cursor:pointer;will-change:transform,opacity,filter}
  .album:focus-visible{outline:1px solid rgba(255,255,255,.5);outline-offset:8px;border-radius:8px}

  /* sleeve back plate = thickness illusion */
  .plate{position:absolute;inset:0;border-radius:5px;background:#080808;
    transform:translateZ(-9px);
    box-shadow:0 0 0 1px rgba(255,255,255,.05), 0 34px 70px rgba(0,0,0,.75)}
  /* sleeve interior (holds the disc) */
  .sleeve{position:absolute;inset:0;border-radius:5px;overflow:hidden;background:#0b0b0b;
    display:grid;place-items:center;
    box-shadow:inset 0 0 40px rgba(0,0,0,.9)}
  .disc{position:relative;width:86%;aspect-ratio:1;border-radius:50%;
    background:
      radial-gradient(circle,var(--label,#c0392b) 0 21%,transparent 21.4%),
      repeating-radial-gradient(circle,#090909 0 1px,#191919 1px 2.5px,#0b0b0b 2.5px 4px,#151515 4px 5.5px),
      #0a0a0a;
    box-shadow:inset 0 0 26px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.06),0 18px 34px rgba(0,0,0,.6);
    opacity:0;transform:translateX(18%) scale(.86);
    transition:opacity .35s ease .18s, transform .6s cubic-bezier(.34,1.35,.64,1) .18s}
  .disc::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:conic-gradient(from 210deg,transparent 0 12%,rgba(255,255,255,.11) 18%,transparent 26% 62%,rgba(255,255,255,.07) 70%,transparent 78%)}
  .disc .hole{position:absolute;top:50%;left:50%;width:9px;height:9px;border-radius:50%;background:#000;
    transform:translate(-50%,-50%);box-shadow:inset 0 0 2px rgba(255,255,255,.25)}
  .disc .dlab{position:absolute;top:50%;left:50%;width:36%;transform:translate(-50%,-50%);
    text-align:center;font-size:clamp(5px,.95vmin,8px);font-weight:800;letter-spacing:.16em;
    line-height:1.25;text-transform:uppercase;color:#fff;opacity:.9;mix-blend-mode:difference}

  /* front cover — hinges open on left edge */
  .cover{position:absolute;inset:0;border-radius:5px;overflow:hidden;z-index:3;
    transform-origin:left center;
    transition:transform .8s cubic-bezier(.65,0,.35,1);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.22),
      inset 0 -1px 0 rgba(0,0,0,.6),
      inset 1px 0 0 rgba(255,255,255,.07),
      inset -1px 0 0 rgba(0,0,0,.5),
      0 26px 56px rgba(0,0,0,.6)}
  .art{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#111}
  .cover::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(168deg,rgba(255,255,255,.16),transparent 26%,transparent 72%,rgba(0,0,0,.42))}
  .cap{position:absolute;top:9px;left:12px;right:12px;z-index:4;
    text-shadow:0 1px 5px rgba(0,0,0,.75)}
  .cap .t{font-size:clamp(10px,1.7vmin,15px);font-weight:800;line-height:1.1;letter-spacing:-.01em}
  .cap .a{margin-top:2px;font-size:clamp(7px,1.1vmin,10px);font-weight:600;letter-spacing:.2em;
    text-transform:uppercase;opacity:.88}
  /* reflection under the focused album */
  .refl{position:absolute;left:6%;right:6%;bottom:-14px;height:16px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(255,255,255,.16),transparent 70%);
    filter:blur(5px);opacity:0;transition:opacity .4s}
  .album.focus .refl{opacity:.5}

  .album.open .cover{transform:rotateY(-138deg)}
  .album.open .disc{opacity:1;transform:translateX(7%) scale(1);animation:spin 5.5s linear infinite}
  @keyframes spin{to{transform:translateX(7%) scale(1) rotate(360deg)}}

  /* ---------- close ---------- */
  .close{position:fixed;top:calc(var(--nav-h) + 6px);right:clamp(14px,3.2vw,34px);z-index:80;
    width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:17px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
    opacity:0;pointer-events:none;transform:scale(.85);
    transition:opacity .3s,transform .3s,background .25s}
  body.open .close{opacity:1;pointer-events:auto;transform:scale(1)}
  .close:hover{background:rgba(255,255,255,.15)}

  /* ---------- hint ---------- */
  .hint{position:fixed;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));z-index:40;
    text-align:center;font-size:9px;letter-spacing:.42em;color:#5e5e5e;text-transform:uppercase;
    pointer-events:none;opacity:0;animation:fin 1s ease .7s forwards;transition:opacity .3s}
  @keyframes fin{to{opacity:1}}
  body.open .hint{opacity:0}

  /* ---------- player ---------- */
  .player{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:75;
    width:min(620px,calc(100vw - 24px));
    display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:15px;
    background:rgba(14,14,14,.86);border:1px solid rgba(255,255,255,.09);
    box-shadow:0 22px 52px rgba(0,0,0,.7);
    transform:translate(-50%,180%);
    transition:transform .6s cubic-bezier(.34,1.2,.64,1)}
  @supports (backdrop-filter:blur(1px)){.player{backdrop-filter:blur(22px)}}
  body.open .player{transform:translate(-50%,0)}
  .pc{width:44px;height:44px;flex:0 0 auto;border-radius:6px;background-size:cover;background-position:center;
    background-color:#161616;box-shadow:0 4px 12px rgba(0,0,0,.5)}
  .pi{flex:1 1 auto;min-width:0}
  .pt{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pa{margin-top:2px;font-size:9.5px;color:#8b8b8b;letter-spacing:.16em;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{flex:1 1 90px;min-width:44px;height:2px;border-radius:2px;background:rgba(255,255,255,.1);
    overflow:hidden;cursor:pointer}
  .bar b{display:block;height:100%;width:0;background:#fff}
  .pb{width:36px;height:36px;flex:0 0 auto;border-radius:50%;background:#fff;color:#000;
    display:grid;place-items:center;font-size:12px;transition:transform .2s}
  .pb:hover{transform:scale(1.07)}
  .noaudio{font-size:9px;letter-spacing:.14em;color:#6d6d6d;text-transform:uppercase;white-space:nowrap}
  /* short viewports (landscape phones): compress the player */
  @media (max-height:460px){
    .pc{display:none}
    .player{padding:8px 12px;border-radius:12px}
    .hint{display:none}
  }
  @media (max-width:420px){.bar{flex-basis:50px}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
      transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<div class="vignette"></div>
<div class="glow"></div>
<div class="grain"></div>
<div class="dust" id="dust"></div>

<nav>
  <div class="logo">VINYL ARCHIVE</div>
  <div class="links">
    <a href="#">MUSIC</a>
    <a href="#">COLLECTION</a>
    <a href="#">ABOUT</a>
  </div>
  <div class="acts">
    <button class="ico" aria-label="Search">&#8981;</button>
    <button class="ico" id="mute" aria-label="Toggle sound">&#9834;</button>
  </div>
</nav>

<main class="stage" id="stage">
  <div class="rail" id="rail"></div>
</main>

<button class="close" id="close" aria-label="Close album">&#10005;</button>

<div class="hint" id="hint">SELECT AN ALBUM TO PLAY</div>

<div class="player" id="player" role="region" aria-label="Now playing">
  <div class="pc" id="pcover"></div>
  <div class="pi">
    <div class="pt" id="ptitle">&mdash;</div>
    <div class="pa" id="partist">&mdash;</div>
  </div>
  <div class="bar" id="bar" role="progressbar" aria-label="Progress"><b id="fill"></b></div>
  <button class="pb" id="play" aria-label="Play or pause">&#9654;</button>
</div>

<audio id="audio" preload="none" crossorigin="anonymous"></audio>

<script>
"use strict";

/* ============ data ============
   Add albums freely — layout is index-driven, nothing hardcoded.
   cover: image URL   audio: mp3/m4a URL (empty = silent demo)   label: disc label colour */
var ALBUMS = [
  {title:"Come Together", artist:"The Beatles", album:"Abbey Road", year:1969, genre:"Rock",
   cover:"https://upload.wikimedia.org/wikipedia/en/4/42/Beatles_-_Abbey_Road.jpg", audio:"", label:"#20242a"},
  {title:"Pink + White", artist:"Frank Ocean", album:"Blonde", year:2016, genre:"R&B",
   cover:"https://upload.wikimedia.org/wikipedia/en/a/a0/Frank_Ocean_-_Blonde.jpeg", audio:"", label:"#e8dcc4"},
  {title:"Tit\u00ed Me Pregunt\u00f3", artist:"Bad Bunny", album:"Un Verano Sin Ti", year:2022, genre:"Reggaeton",
   cover:"https://upload.wikimedia.org/wikipedia/en/d/d3/Bad_Bunny_-_Un_Verano_Sin_Ti.png", audio:"", label:"#d8492a"},
  {title:"Taste", artist:"Sabrina Carpenter", album:"Short n' Sweet", year:2024, genre:"Pop",
   cover:"https://upload.wikimedia.org/wikipedia/en/3/3a/Sabrina_Carpenter_-_Short_n%27_Sweet.png", audio:"", label:"#3a6ea5"},
  {title:"Cry For Me", artist:"The Weeknd", album:"Hurry Up Tomorrow", year:2025, genre:"R&B",
   cover:"https://upload.wikimedia.org/wikipedia/en/1/1e/The_Weeknd_-_Hurry_Up_Tomorrow.png", audio:"", label:"#171717"},
  {title:"Wildest Dreams", artist:"Taylor Swift", album:"1989 (Taylor's Version)", year:2023, genre:"Pop",
   cover:"https://upload.wikimedia.org/wikipedia/en/9/9f/Taylor_Swift_-_1989_%28Taylor%27s_Version%29.png", audio:"", label:"#8fc3dd"},
  {title:"360", artist:"Charli xcx", album:"BRAT", year:2024, genre:"Hyperpop",
   cover:"https://upload.wikimedia.org/wikipedia/en/e/e1/Charli_XCX_-_Brat_%28album%29.png", audio:"", label:"#8ace01"}
];

var rail   = document.getElementById("rail");
var stage  = document.getElementById("stage");
var player = document.getElementById("player");
var audio  = document.getElementById("audio");
var pcover = document.getElementById("pcover");
var ptitle = document.getElementById("ptitle");
var partist= document.getElementById("partist");
var playBtn= document.getElementById("play");
var fill   = document.getElementById("fill");
var bar    = document.getElementById("bar");
var closeBtn = document.getElementById("close");
var muteBtn  = document.getElementById("mute");

var PLAY  = "\u25B6";
var PAUSE = "\u275A\u275A";
var cards = [];
var openIdx = -1;

/* ---------- build cards ---------- */
ALBUMS.forEach(function (a, i) {
  var el = document.createElement("div");
  el.className = "album";
  el.tabIndex = 0;
  el.setAttribute("role", "button");
  el.setAttribute("aria-label", a.title + " by " + a.artist);
  el.style.setProperty("--label", a.label || "#c0392b");

  var plate = document.createElement("div");
  plate.className = "plate";

  var sleeve = document.createElement("div");
  sleeve.className = "sleeve";
  var disc = document.createElement("div");
  disc.className = "disc";
  var dlab = document.createElement("div");
  dlab.className = "dlab";
  dlab.textContent = a.album + " \u00B7 " + a.year;
  var hole = document.createElement("div");
  hole.className = "hole";
  disc.appendChild(dlab);
  disc.appendChild(hole);
  sleeve.appendChild(disc);

  var cover = document.createElement("div");
  cover.className = "cover";
  var art = document.createElement("div");
  art.className = "art";
  art.style.backgroundImage = 'url("' + a.cover + '")';
  var cap = document.createElement("div");
  cap.className = "cap";
  var t = document.createElement("div");
  t.className = "t";
  t.textContent = a.title;
  var ar = document.createElement("div");
  ar.className = "a";
  ar.textContent = a.artist;
  cap.appendChild(t);
  cap.appendChild(ar);
  cover.appendChild(art);
  cover.appendChild(cap);

  var refl = document.createElement("div");
  refl.className = "refl";

  el.appendChild(plate);
  el.appendChild(sleeve);
  el.appendChild(cover);
  el.appendChild(refl);

  el.addEventListener("click", function () { activate(i); });
  el.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(i); }
  });

  rail.appendChild(el);
  cards.push(el);
});

/* ---------- ratio-aware metrics ----------
   Everything derives from the live viewport, so 21:9, 1:1, 9:16 and
   short landscape phones all get a stack that fits without clipping. */
var M = { gap: 90, card: 300, span: 3, depth: 46 };

function measure() {
  var cs = getComputedStyle(document.documentElement);
  M.card = parseFloat(cs.getPropertyValue("--card")) || 260;
  M.gap  = parseFloat(cs.getPropertyValue("--gap"))  || M.card * 0.3;

  var vh = window.innerHeight;
  var vw = window.innerWidth;
  var navH = 60;
  /* usable area = viewport below the nav row, with a margin for the close button
     and the player. We size the visible stack so its full span fits there. */
  var usable = vh - navH - 110;

  /* how many neighbours fit above/below the focused album */
  var fit = Math.floor((usable - M.card) / (2 * M.gap));
  M.span = Math.max(1, Math.min(3.4, fit + 1.2));

  /* wide+short viewports: flatten depth so nothing pokes out of frame */
  var ratio = vw / vh;
  M.depth = ratio > 1.9 ? 30 : (ratio < 0.62 ? 52 : 44);
  M.tilt  = vh < 520 ? 6 : 13;
}

/* ---------- focus spring ---------- */
var focus = 0;        /* animated */
var target = 0;       /* snap goal */
var raf = 0;

function clampT(v) { return Math.max(0, Math.min(ALBUMS.length - 1, v)); }

function layout() {
  var open = openIdx >= 0;
  for (var i = 0; i < cards.length; i++) {
    var el = cards[i];
    var d = i - focus;
    var ad = Math.abs(d);

    if (open) {
      if (i === openIdx) {
        el.style.transform = "translate3d(0,0,150px) rotateX(0deg)";
        el.style.opacity = "1";
        el.style.filter = "brightness(1)";
        el.style.zIndex = "60";
      } else {
        el.style.transform = "translate3d(0," + (d * M.gap * 1.25) + "px,-220px) rotateX(" + M.tilt + "deg)";
        el.style.opacity = "0.12";
        el.style.filter = "brightness(.3)";
        el.style.zIndex = "1";
      }
      el.classList.toggle("focus", false);
      continue;
    }

    var y = d * M.gap;
    var z = -ad * M.depth;
    var sc = 1 - Math.min(ad * 0.055, 0.34);
    var rx = M.tilt + d * -1.6;                       /* steeper up top, flat at bottom */
    var rz = (i % 2 ? 1 : -1) * (1.4 - Math.min(ad, 3) * 0.25);
    var x = (i % 2 ? 1 : -1) * Math.min(ad, 2) * (M.card * 0.028);
    var vis = ad > M.span + 0.9 ? 0 : (ad > M.span ? (M.span + 0.9 - ad) / 0.9 : 1);

    el.style.transform =
      "translate3d(" + x + "px," + y + "px," + z + "px)" +
      " rotateX(" + rx + "deg) rotateZ(" + rz + "deg) scale(" + sc + ")";
    el.style.opacity = String(vis);
    el.style.filter = "brightness(" + (1 - Math.min(ad * 0.17, 0.62)).toFixed(3) + ")";
    el.style.zIndex = String(100 - Math.round(ad * 10));
    el.style.pointerEvents = vis < 0.35 ? "none" : "auto";
    el.classList.toggle("focus", ad < 0.4);
  }
}

function tick() {
  var diff = target - focus;
  if (Math.abs(diff) < 0.0007) {
    focus = target;
    layout();
    raf = 0;
    return;
  }
  focus += diff * 0.16;                                /* spring-ish ease */
  layout();
  raf = requestAnimationFrame(tick);
}
function kick() { if (!raf) raf = requestAnimationFrame(tick); }
function goTo(v) { target = clampT(v); kick(); }

/* ---------- interactions ---------- */
function activate(i) {
  if (suppressClick) return;                              /* came from a drag */
  if (openIdx === i) { closeAlbum(); return; }
  if (Math.abs(i - target) > 0.45) { goTo(i); return; }   /* first click = bring to front */
  openAlbum(i);
}

function openAlbum(i) {
  openIdx = i;
  target = i; focus = i;
  cards.forEach(function (el, j) { el.classList.toggle("open", j === i); });
  document.body.classList.add("open");

  var a = ALBUMS[i];
  pcover.style.backgroundImage = 'url("' + a.cover + '")';
  ptitle.textContent = a.title;
  partist.textContent = a.artist + " \u2014 " + a.album + " \u00B7 " + a.year;

  if (a.audio) {
    audio.src = a.audio;
    audio.play().then(function () { playBtn.textContent = PAUSE; })
                .catch(function () { playBtn.textContent = PLAY; });
    playBtn.style.display = "";
    bar.style.display = "";
  } else {
    audio.removeAttribute("src");
    playBtn.textContent = PLAY;                        /* no audio file wired yet */
    fill.style.width = "0%";
  }
  layout();
}

function closeAlbum() {
  if (openIdx < 0) return;
  cards.forEach(function (el) { el.classList.remove("open"); });
  document.body.classList.remove("open");
  audio.pause();
  playBtn.textContent = PLAY;
  openIdx = -1;
  layout();
}

closeBtn.addEventListener("click", closeAlbum);

/* wheel / trackpad */
var wheelAcc = 0;
stage.addEventListener("wheel", function (e) {
  if (openIdx >= 0) return;
  e.preventDefault();
  wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) > 42) {
    goTo(target + (wheelAcc > 0 ? 1 : -1));
    wheelAcc = 0;
  }
}, { passive: false });

/* pointer drag — works for touch, pen and mouse, any orientation.
   No setPointerCapture: capturing retargets the follow-up click to the stage
   and the album's own click handler would never fire. Window listeners give
   the same drag-outside-the-element behaviour without stealing the click. */
var drag = null;
var suppressClick = false;
var DRAG_SLOP = 5;

stage.addEventListener("pointerdown", function (e) {
  if (openIdx >= 0) return;
  if (e.button !== undefined && e.button !== 0) return;
  drag = { y: e.clientY, x: e.clientX, base: target, moved: false };
});

window.addEventListener("pointermove", function (e) {
  if (!drag) return;
  var dy = e.clientY - drag.y;
  var dx = e.clientX - drag.x;
  /* landscape-ish viewports read horizontal swipes too */
  var d = Math.abs(dx) > Math.abs(dy) * 1.4 ? dx : dy;
  if (!drag.moved && Math.abs(d) <= DRAG_SLOP) return;   /* tap, not a drag */
  drag.moved = true;
  focus = clampT(drag.base - d / (M.gap * 1.25));
  target = focus;
  layout();
});

function endDrag() {
  if (!drag) return;
  var moved = drag.moved;
  drag = null;
  if (moved) {
    goTo(Math.round(focus));
    suppressClick = true;                                /* swallow the drag's click */
    setTimeout(function () { suppressClick = false; }, 80);
  }
}
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);

/* keyboard */
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { closeAlbum(); return; }
  if (openIdx >= 0) return;
  if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); goTo(target + 1); }
  if (e.key === "ArrowUp"   || e.key === "ArrowLeft")  { e.preventDefault(); goTo(target - 1); }
  if (e.key === "Enter") { openAlbum(Math.round(target)); }
});

/* player controls */
playBtn.addEventListener("click", function (e) {
  e.stopPropagation();
  if (!audio.getAttribute("src")) return;
  if (audio.paused) { audio.play().catch(function () {}); playBtn.textContent = PAUSE; }
  else { audio.pause(); playBtn.textContent = PLAY; }
});
audio.addEventListener("timeupdate", function () {
  if (audio.duration) fill.style.width = (audio.currentTime / audio.duration * 100) + "%";
});
audio.addEventListener("ended", function () { playBtn.textContent = PLAY; fill.style.width = "0%"; });
bar.addEventListener("click", function (e) {
  if (!audio.duration) return;
  var r = bar.getBoundingClientRect();
  audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
});
muteBtn.addEventListener("click", function () {
  audio.muted = !audio.muted;
  muteBtn.innerHTML = audio.muted ? "&#9835;&#822;" : "&#9834;";
});

/* dust — count scales with viewport area, cheap on phones */
(function dustInit() {
  var host = document.getElementById("dust");
  var n = Math.round(Math.min(26, Math.max(8, (window.innerWidth * window.innerHeight) / 46000)));
  for (var i = 0; i < n; i++) {
    var d = document.createElement("i");
    d.style.left = (Math.random() * 100) + "%";
    d.style.animationDuration = (13 + Math.random() * 19) + "s";
    d.style.animationDelay = (-Math.random() * 24) + "s";
    d.style.opacity = String(0.2 + Math.random() * 0.45);
    d.style.transform = "scale(" + (0.6 + Math.random() * 1.5) + ")";
    host.appendChild(d);
  }
})();

/* resize / orientation / mobile URL-bar changes */
var rt = 0;
function onResize() {
  clearTimeout(rt);
  rt = setTimeout(function () { measure(); layout(); }, 90);
}
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", onResize);

/* boot */
measure();
target = focus = Math.floor(ALBUMS.length / 2);
layout();

/* self-check: surfaced in console, not to the user */
(function selfCheck() {
  var n = rail.querySelectorAll(".album").length;
  var okCount = n === ALBUMS.length;
  var okTransform = cards.every(function (el) { return /translate3d/.test(el.style.transform); });
  var okFit = (M.card + 2 * M.gap * M.span) <= window.innerHeight + M.card;
  console.log("[vinyl-archive] cards=" + n + " expected=" + ALBUMS.length +
              " transforms=" + okTransform + " fitsViewport=" + okFit +
              " span=" + M.span.toFixed(2) + " card=" + M.card + " gap=" + M.gap);
  if (!okCount || !okTransform) console.error("[vinyl-archive] render self-check FAILED");
})();
</script>
